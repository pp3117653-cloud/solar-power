<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Solar Power mark</title>
  <desc id="desc">A cyan holographic sun with a central orbital ring.</desc>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7b2"/>
      <stop offset="0.32" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#06111f"/>
  <g fill="none" stroke="#67e8f9" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="128" cy="128" rx="92" ry="38" transform="rotate(-24 128 128)" stroke-width="5" opacity=".75"/>
    <ellipse cx="128" cy="128" rx="92" ry="38" transform="rotate(24 128 128)" stroke-width="3" opacity=".5"/>
  </g>
  <circle cx="128" cy="128" r="46" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="16" fill="#fff7b2" opacity=".9"/>
</svg>
