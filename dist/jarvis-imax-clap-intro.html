    const GLSL_NOISE = `
      float hash(vec3 p) {
        p = fract(p * 0.3183099 + 0.1);
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }
      float noise(vec3 x) {
        vec3 i = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
              mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
          mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
              mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
          f.z
        );
      }
      float fbm(vec3 p) {
        float v = 0.0; float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = p * 2.04 + vec3(1.7, 9.2, 3.4);
          a *= 0.5;
        }
        return v;
      }
      float ridged(vec3 p) {
        float v = 0.0; float a = 0.5;
        for (int i = 0; i < 3; i++) {
          float n = 1.0 - abs(noise(p) * 2.0 - 1.0);
          v += a * n * n;
          p = p * 2.1 + vec3(2.3, 4.1, 1.9);
          a *= 0.5;
        }
        return v;
      }
    `;

    const PLANET_VERT = `

      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec3 vViewNormal;
      void main() {
        vObjPos = normalize(position);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        vViewNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }

            else if (uType == 4) {

              float turb = fbm(vec3(p.x * 4.0, p.y * 9.0, p.z * 4.0) + vec3(uTime * 0.06, 0.0, 0.0));
              float yBand = p.y * 14.0 + turb * 2.1;

    function playCinemaIgnitionSound() {

        if (!AC) return;

        sub.frequency.setValueAtTime(115, now);
        sub.frequency.exponentialRampToValueAtTime(34, now + 1.15);
        sub.frequency.exponentialRampToValueAtTime(28, now + 2.6);
        subG.gain.setValueAtTime(0.001, now);
        subG.gain.linearRampToValueAtTime(0.28, now + 0.15);
        subG.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
        sub.connect(subG); subG.connect(audioCtx.destination);
        sub.start(now); sub.stop(now + 2.9);

        // 2. Cinematic Brass-Like Rising THX Harmonic Swell (1.1s - 5.8s)
        [65.41, 130.81, 196.0, 261.63, 329.63, 392.0].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const filt = audioCtx.createBiquadFilter();
          osc.type = idx < 2 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq * 0.88, now + 0.9);
          osc.frequency.exponentialRampToValueAtTime(freq, now + 2.6 + idx * 0.12);
          filt.type = 'lowpass';
          filt.frequency.setValueAtTime(220, now + 0.9);
          filt.frequency.exponentialRampToValueAtTime(2400, now + 4.4);
          g.gain.setValueAtTime(0.0001, now + 0.9);
          g.gain.linearRampToValueAtTime(0.045 / (idx * 0.25 + 1), now + 2.8);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 6.2);
          osc.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
          osc.start(now + 0.9); osc.stop(now + 6.3);
        });

        // 3. High-Tension Metallic Cinema Riser (0.0s -> 1.18s)
        const riser = audioCtx.createOscillator();
        const riserG = audioCtx.createGain();
        riser.type = 'sawtooth';
        riser.frequency.setValueAtTime(140, now);
        riser.frequency.exponentialRampToValueAtTime(1850, now + 1.18);
        riserG.gain.setValueAtTime(0.001, now);
        riserG.gain.exponentialRampToValueAtTime(0.09, now + 1.15);
        riserG.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
        riser.connect(riserG); riserG.connect(audioCtx.destination);
        riser.start(now); riser.stop(now + 1.28);

        // 4. Relativistic Shockwave Blast Whoosh at T = 1.2s
        const bufLen = Math.floor(audioCtx.sampleRate * 1.4);
        const nBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);

        for (let i = 0; i < bufLen; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.35));
        const nSrc = audioCtx.createBufferSource();

        const nFilt = audioCtx.createBiquadFilter();
        nFilt.type = 'bandpass'; nFilt.frequency.setValueAtTime(900, now + 1.18);

        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.24, now + 1.18);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(audioCtx.destination);

      earthCloudMat.uniforms.uTime.value = elapsed;
      earthCloudMat.uniforms.uSunWorldPos.value.copy(sunWorldVec);
      accretionMat.uniforms.uTime.value = elapsed;
      saturnRingMat.uniforms.uSunWorldPos.value.copy(sunWorldVec);
      if (bodyMeshes.saturn) bodyMeshes.saturn.holder.getWorldPosition(saturnRingMat.uniforms.uSaturnWorldPos.value);

      if (state.stage === 'solar') {
        const speedBoost = state.singularity ? 3.2 : 1.0;
        const yearOff = (state.year - 2026) * 0.45;
        BODIES.forEach((b, idx) => {
          const e = bodyMeshes[b.id];
          if (state.sizeScaleMode) {
            e.holder.position.set(-4.6 + idx * 1.02, 0, 0);
            e.holder.scale.setScalar(b.scaleR / b.r);
            if (orbitLines[b.id]) orbitLines[b.id].visible = false;
          } else {
            if (state.introPhase === 'done') e.holder.scale.setScalar(1.0);
            if (orbitLines[b.id]) orbitLines[b.id].visible = true;
            if (b.dist > 0) {
              e.angle += dt * b.speed * 0.22 * speedBoost;
              const a = e.angle + yearOff * b.speed;
              const inclRad = (b.incl * Math.PI) / 180;
              e.holder.position.set(
                Math.cos(a) * b.dist,
                Math.sin(a) * b.dist * Math.sin(inclRad) + state.explodeCurr * (idx - 4.5) * 0.36,
                Math.sin(a) * b.dist * (b.id === 'pluto' ? 0.88 : 1.0)
              );
            }
          }
          e.outer.rotation.y += dt * (b.id === 'sun' ? 0.12 : 0.36);
        });
        if (earthCloudMesh) earthCloudMesh.rotation.y += dt * 0.46;
        if (earthMoonPivot) earthMoonPivot.rotation.y += dt * 1.45;
        for (let m = 0; m < moonPivots.length; m++) moonPivots[m].piv.rotation.y += dt * moonPivots[m].speed * speedBoost;
        dwarfBodies.forEach((d) => {
          d.angle += dt * d.speed * 0.22 * speedBoost;
          const ir = (d.incl * Math.PI) / 180;
          d.mesh.position.set(Math.cos(d.angle) * d.dist, Math.sin(d.angle) * d.dist * Math.sin(ir), Math.sin(d.angle) * d.dist);
          d.mesh.visible = !state.sizeScaleMode;
        });
        kuiperBelt.rotation.y += dt * 0.012 * speedBoost;
        kuiperBelt.visible = !state.sizeScaleMode;
        asteroidBelt.rotation.y += dt * 0.045 * speedBoost;
        asteroidBelt.visible = !state.sizeScaleMode;

        if (state.singularity) {
          accretionDisk.rotation.z -= dt * 0.8;
          photonSphere.lookAt(camera.position);
        }

        for (let i = 0; i < windCount; i++) {
          const w = windData[i];
          if (state.singularity) { w.r -= dt * w.sp * 1.5; w.a += dt * (1.8 / Math.max(0.6, w.r)); if (w.r < 0.5) w.r = 6.2; }
          else { w.r += dt * w.sp; if (w.r > 6.2) w.r = 0.72; }
          windPosAttr.setXYZ(i, Math.cos(w.a) * w.r, w.y, Math.sin(w.a) * w.r);
        }
        windPosAttr.needsUpdate = true;
        solarWind.visible = !state.sizeScaleMode;

        cometAngle += dt * 0.34;
        cometGroup.position.set(Math.cos(cometAngle) * 4.1 + 1.2, Math.sin(cometAngle) * 0.95, Math.sin(cometAngle) * 2.4);
        cometGroup.lookAt(0, 0, 0);
        cometGroup.visible = !state.sizeScaleMode;

        if (state.gravityWell) {
          const jPos = bodyMeshes.jupiter.holder.position, sPos = bodyMeshes.saturn.holder.position;
          const sunDepth = state.singularity ? 3.9 : 1.6;
          for (let i = 0; i < wellPosAttr.count; i++) {
            const x = wellPosAttr.getX(i), z = wellPosAttr.getZ(i);
            const rSun = Math.sqrt(x * x + z * z) + (state.singularity ? 0.35 : 0.45);
            const rJup = Math.sqrt((x - jPos.x) ** 2 + (z - jPos.z) ** 2) + 0.55;
            const rSat = Math.sqrt((x - sPos.x) ** 2 + (z - sPos.z) ** 2) + 0.6;
            wellPosAttr.setY(i, -(sunDepth / rSun) - (0.38 / rJup) - (0.25 / rSat));
          }
          wellPosAttr.needsUpdate = true;
        }

        if (state.photonActive) {
          state.photonRadius += dt * 1.25;
          photonRing.scale.setScalar(state.photonRadius);
          document.getElementById('photon-hud').textContent = `c = 299,792 km/s · T+${((state.photonRadius / 1.98) * 8.3).toFixed(1)} min`;
          if (state.photonRadius > 7.0) { state.photonActive = false; photonRing.visible = false; document.getElementById('photon-hud').classList.add('hidden'); }
        }

        if (trajGroup.visible && trajCurvePts.length > 2) {
          probeProgress = (probeProgress + dt * 0.22) % 1;
          const i = Math.min(trajCurvePts.length - 2, Math.floor(probeProgress * (trajCurvePts.length - 1)));
          probeMesh.position.copy(trajCurvePts[i]); probeMesh.lookAt(trajCurvePts[i + 1]); probeMesh.rotateX(Math.PI / 2);
        }
      } else {
        const beatFreq = (state.heartBpm / 60) * Math.PI * 2;
        const pulse = 1 + 0.16 * Math.pow(Math.max(0, Math.sin(elapsed * beatFreq)), 4);
        heartMesh.scale.set(0.9 * pulse, 1.15 * pulse, 0.85 * pulse);
        const breath = 1 + 0.055 * Math.sin(elapsed * 1.6);
        lungsGroup.scale.set(breath, 1 + 0.03 * Math.sin(elapsed * 1.6), breath);

        const bpmFactor = state.heartBpm / 72;
        for (let i = 0; i < bloodCount; i++) {
          const bm = bloodMeta[i]; bm.t = (bm.t + dt * bm.sp * bpmFactor) % 1;
          const dir = bm.arterial ? bm.t : (1 - bm.t);
          let bx = 0.06, by = 0.22, bz = 0.14;
          if (bm.lane === 0) { bx = (bm.arterial ? 0.08 : -0.08); by = 0.22 + dir * 1.0; bz = 0.05; }
          else if (bm.lane === 1) { bx = -0.15 - dir * 0.62; by = 0.45 - dir * 0.95; bz = 0.02; }
          else if (bm.lane === 2) { bx = 0.15 + dir * 0.62; by = 0.45 - dir * 0.95; bz = 0.02; }
          else { bx = (bm.arterial ? 0.22 : -0.22); by = 0.15 - dir * 2.15; bz = 0.02; }
          bloodPosAttr.setXYZ(i, bx, by, bz);
        }
        bloodPosAttr.needsUpdate = true;

        synapsePulses.forEach((sp) => { sp.phase = (sp.phase + dt * 0.95) % 1; sp.mesh.position.set(0, -0.65 + sp.phase * 1.85, -0.18); });
        cellGroup.rotation.y += dt * 0.25; dnaGroup.rotation.y += dt * 1.1;
        drawEcg(dt);
      }

      if (state.cinemaMode) {
        state.rotX = 0.26 + Math.sin(elapsed * 0.22) * 0.16;
        state.rotY += dt * 0.14;
        state.zoom = 1.08 + Math.sin(elapsed * 0.18) * 0.22;
      }
      worldGroup.rotation.x = state.rotX;
      worldGroup.rotation.y = state.rotY + elapsed * 0.026;
      const targetZ = (state.stage === 'human' ? 4.8 : 9.0) / state.zoom;
      camera.position.z += (targetZ - camera.position.z) * 0.1;
      camera.lookAt(0, 0, 0);
      stars.rotation.y += dt * 0.004;
      renderFrame();
    }

    renderQuickBar();
    applyVisualMode();
    animate();
  })();
  </script>
</body>
</html>
